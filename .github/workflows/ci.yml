name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .

      - name: Run tests with coverage (fail-under=90)
        run: |
          pytest --cov=toolkit_cost_latency_opt --cov-report=xml --cov-report=term --cov-fail-under=90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .

      - name: Run ruff
        run: ruff check .

      - name: Run pyright
        run: pyright

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
          pip install -e ".[dev]" || pip install -e .

      - name: Run pip-audit (CLI package)
        run: pip-audit --desc --skip-editable

      - name: Run bandit (CLI package)
        run: bandit -r src/ -c pyproject.toml

  build:
    name: Build and check package
    runs-on: ubuntu-latest
    needs: [test, lint, security-scan]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build "twine>=6.1"
          python -m build
      - name: Check the metadata (twine 6.1+ reads Metadata 2.4)
        run: twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/toolkit-opt" --help > /dev/null

  cli-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Test CLI commands
        run: |
          toolkit-opt --help
          toolkit-opt validate --help
          toolkit-opt summarize --help
          toolkit-opt recommend --help
          toolkit-opt simulate --help
          toolkit-opt ingest --help
          toolkit-opt route --help
