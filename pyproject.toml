[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-cost-optimizer"
version = "1.0.0"
description = "LLM spend and routing analyzer: ingest gateway, trace and usage exports, price requests by token class, and find the cheapest routing that keeps quality."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AKIVA AI, LLC" }]
keywords = ["llm", "cost", "routing", "finops", "litellm", "opentelemetry", "pricing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AKIVA-AI/toolkit-cost-optimizer"
Documentation = "https://github.com/AKIVA-AI/toolkit-cost-optimizer#readme"
Repository = "https://github.com/AKIVA-AI/toolkit-cost-optimizer"
Issues = "https://github.com/AKIVA-AI/toolkit-cost-optimizer/issues"
Changelog = "https://github.com/AKIVA-AI/toolkit-cost-optimizer/blob/main/CHANGELOG.md"

[project.scripts]
toolkit-opt = "toolkit_cost_latency_opt.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
  "jsonschema>=4.18",
  "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["toolkit_cost_latency_opt"]
omit = ["*/toolkit_cost_latency_opt/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]

[tool.ruff.lint.isort]
known-first-party = ["toolkit_cost_latency_opt"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toolkit_cost_latency_opt = ["py.typed", "data/*.json"]
